<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRJ SHOP | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    header {
      background: #101828;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 23px;
    }

    header span {
      color: #75a7ff;
    }

    button {
      border: none;
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .logout {
      background: #fff;
      color: #101828;
    }

    main {
      width: min(1100px, 94%);
      margin: 25px auto;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 3px 15px #00000008;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #d5dae3;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    .primary {
      background: #1769ff;
      color: white;
    }

    .secondary {
      background: #e8edf5;
      color: #172033;
    }

    .danger {
      background: #ffe5e5;
      color: #b42318;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .product {
      border: 1px solid #e3e7ee;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    .product img {
      width: 78px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-info h3 {
      font-size: 16px;
      overflow-wrap: anywhere;
      margin-bottom: 5px;
    }

    .product-info p {
      font-size: 13px;
      color: #667085;
      margin: 4px 0;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .message {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      display: none;
      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      color: #b42318;
      background: #fff0f0;
    }

    .success {
      display: block;
      color: #067647;
      background: #ecfdf3;
    }

    #adminApp, #loginPanel {
      display: none;
    }

    .muted {
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .panel {
        padding: 16px;
      }

      .product {
        align-items: flex-start;
      }

      .product img {
        width: 65px;
        height: 65px;
      }

      .product-info h3 {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>BRJ <span>SHOP</span> — Admin</h1>
  <button class="logout" id="logoutBtn" style="display:none">
    Logout
  </button>
</header>

<main>

  <!-- LOGIN -->
  <section class="panel" id="loginPanel">
    <h2>Admin Login 🔐</h2>

    <p class="muted">
      Apne authorized admin account se login karo.
      Normal customer account ko admin access nahi milega.
    </p>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">
      <label>Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Admin email"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      >

      <button class="primary" type="submit" id="loginBtn">
        Login to Admin
      </button>
    </form>
  </section>

  <!-- ADMIN APP -->
  <section id="adminApp">

    <div class="panel">
      <h2 id="formTitle">➕ Add New Product</h2>

      <div id="productMessage" class="message"></div>

      <form id="productForm">
        <div class="form-grid">

          <div>
            <label>Product Name *</label>
            <input
              id="productName"
              type="text"
              maxlength="150"
              placeholder="Example: Wireless Headphones"
              required
            >
          </div>

          <div>
            <label>Price (₹) *</label>
            <input
              id="productPrice"
              type="number"
              min="0"
              step="0.01"
              placeholder="999"
              required
            >
          </div>

          <div>
            <label>Category</label>
            <input
              id="productCategory"
              type="text"
              maxlength="100"
              placeholder="Electronics"
            >
          </div>

          <div>
            <label>Stock Quantity *</label>
            <input
              id="productStock"
              type="number"
              min="0"
              step="1"
              value="1"
              required
            >
          </div>

          <div class="full">
            <label>Product Image URL</label>
            <input
              id="productImage"
              type="url"
              placeholder="https://example.com/product.jpg"
            >
          </div>

          <div class="full">
            <label>Description</label>
            <textarea
              id="productDescription"
              maxlength="3000"
              placeholder="Product ke baare mein details..."
            ></textarea>
          </div>

          <div class="full">
            <label>Product Status</label>
            <select id="productStatus">
              <option value="true">Active — Website par dikhega</option>
              <option value="false">Inactive — Website par nahi dikhega</option>
            </select>
          </div>

        </div>

        <button class="primary" type="submit" id="saveBtn">
          Save Product
        </button>

        <button
          class="secondary"
          type="button"
          id="cancelEditBtn"
          style="display:none"
        >
          Cancel Edit
        </button>
      </form>
    </div>

    <div class="panel">
      <h2>📦 Manage Products</h2>
      <p class="muted" id="productCount">Products load ho rahe hain...</p>
      <br>
      <button class="secondary" id="refreshBtn">Refresh Products</button>
      <br><br>
      <div id="productList"></div>
    </div>

  </section>

</main>

<script>
  // Supabase project settings
  const SUPABASE_URL = "https://tcsrgimayfphvknvovxb.supabase.co";
  const SUPABASE_KEY = "sb_publishable__X-pd3gnggmMXAOMx0hM0w_ayEyeyv9";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginPanel = document.getElementById("loginPanel");
  const adminApp = document.getElementById("adminApp");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginMessage = document.getElementById("loginMessage");
  const productMessage = document.getElementById("productMessage");
  const productList = document.getElementById("productList");

  let currentUser = null;
  let editingProductId = null;
  let loadingProducts = false;

  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = "message " + type;
  }

  function clearMessage(element) {
    element.textContent = "";
    element.className = "message";
  }

  function showLogin() {
    currentUser = null;
    adminApp.style.display = "none";
    loginPanel.style.display = "block";
    logoutBtn.style.display = "none";
  }

  function showAdmin() {
    loginPanel.style.display = "none";
    adminApp.style.display = "block";
    logoutBtn.style.display = "inline-block";
  }

  // Verify that the signed-in user is listed in admin_users.
  async function verifyAdmin(user) {
    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      throw new Error(
        "Admin permission check failed. Supabase RLS policies check karo."
      );
    }

    if (!data) {
      throw new Error(
        "Is account ko admin permission nahi hai. admin_users table mein user ID add karo."
      );
    }

    currentUser = user;
    showAdmin();
    await loadProducts();
  }

  async function checkSession() {
    loginPanel.style.display = "none";
    adminApp.style.display = "none";

    const { data, error } = await db.auth.getSession();

    if (error) {
      showLogin();
      showMessage(loginMessage, error.message, "error");
      return;
    }

    if (!data.session) {
      showLogin();
      return;
    }

    try {
      await verifyAdmin(data.session.user);
    } catch (error) {
      await db.auth.signOut();
      showLogin();
      showMessage(loginMessage, error.message, "error");
    }
  }

  // Admin login
  document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();
      clearMessage(loginMessage);

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const loginBtn = document.getElementById("loginBtn");

      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      loginBtn.disabled = false;
      loginBtn.textContent = "Login to Admin";

      if (error) {
        showMessage(
          loginMessage,
          "Login failed: " + error.message,
          "error"
        );
        return;
      }

      try {
        await verifyAdmin(data.user);
      } catch (error) {
        await db.auth.signOut();
        showLogin();
        showMessage(loginMessage, error.message, "error");
      }
    }
  );

  // Logout
  logoutBtn.addEventListener("click", async function() {
    await db.auth.signOut();
    showLogin();
    clearMessage(loginMessage);
  });

  // Reset product form
  function resetForm() {
    editingProductId = null;
    document.getElementById("productForm").reset();
    document.getElementById("productStock").value = "1";
    document.getElementById("productStatus").value = "true";
    document.getElementById("formTitle").textContent = "➕ Add New Product";
    document.getElementById("saveBtn").textContent = "Save Product";
    document.getElementById("cancelEditBtn").style.display = "none";
    clearMessage(productMessage);
  }

  document.getElementById("cancelEditBtn").addEventListener(
    "click",
    resetForm
  );

  // Save or update a product
  document.getElementById("productForm").addEventListener(
    "submit",
    async function(event) {
      event.preventDefault();
      clearMessage(productMessage);

      if (!currentUser) {
        showMessage(productMessage, "Pehle admin login karo.", "error");
        return;
      }

      const name = document.getElementById("productName").value.trim();
      const price = Number(document.getElementById("productPrice").value);
      const stockInput = document.getElementById("productStock").value;
      const stock = Number(stockInput);
      const image = document.getElementById("productImage").value.trim();

      if (!name) {
        showMessage(productMessage, "Product name required hai.", "error");
        return;
      }

      if (!Number.isFinite(price) || price < 0) {
        showMessage(productMessage, "Valid price enter karo.", "error");
        return;
      }

      if (
        stockInput === "" ||
        !Number.isInteger(stock) ||
        stock < 0
      ) {
        showMessage(
          productMessage,
          "Stock ek zero ya positive whole number hona chahiye.",
          "error"
        );
        return;
      }

      if (image) {
        try {
          const parsed = new URL(image);
          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
            throw new Error("Invalid image URL");
          }
        } catch {
          showMessage(
            productMessage,
            "Image URL sahi enter karo, ya field blank chhodo.",
            "error"
          );
          return;
        }
      }

      const product = {
        name,
        price,
        category: document.getElementById("productCategory").value.trim() || null,
        stock,
        image_url: image || null,
        description:
          document.getElementById("productDescription").value.trim() || null,
        is_active: document.getElementById("productStatus").value === "true"
      };

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      let result;

      if (editingProductId !== null) {
        result = await db
          .from("products")
          .update(product)
          .eq("id", editingProductId)
          .select("id");
      } else {
        result = await db
          .from("products")
          .insert(product)
          .select("id");
      }

      saveBtn.disabled = false;
      saveBtn.textContent =
        editingProductId !== null ? "Update Product" : "Save Product";

      if (result.error) {
        showMessage(
          productMessage,
          "Save nahi hua: " + result.error.message,
          "error"
        );
        return;
      }

      if (!result.data || result.data.length === 0) {
        showMessage(
          productMessage,
          "Product save confirm nahi hua. Admin RLS policies check karo.",
          "error"
        );
        return;
      }

      showMessage(
        productMessage,
        editingProductId !== null
          ? "Product successfully update ho gaya! ✅"
          : "Product successfully add ho gaya! ✅",
        "success"
      );

      resetForm();
      await loadProducts();
    }
  );

  // Create product card safely using DOM APIs
  function createProductCard(product) {
    const card = document.createElement("div");
    card.className = "product";

    if (product.image_url) {
      const img = document.createElement("img");
      img.src = product.image_url;
      img.alt = product.name;
      img.loading = "lazy";
      img.onerror = function() {
        img.style.display = "none";
      };
      card.appendChild(img);
    }

    const info = document.createElement("div");
    info.className = "product-info";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.textContent = "Price: ₹" + Number(product.price).toFixed(2);

    const stock = document.createElement("p");
    stock.textContent = "Stock: " + product.stock;

    const status = document.createElement("p");
    status.textContent = product.is_active ? "Status: Active" : "Status: Inactive";

    const category = document.createElement("p");
    category.textContent = "Category: " + (product.category || "Uncategorized");

    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.className = "secondary";
    editBtn.textContent = "Edit";
    editBtn.addEventListener("click", function() {
      startEdit(product);
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.textContent = "Delete";
    deleteBtn.addEventListener("click", function() {
      deleteProduct(product.id, product.name);
    });

    actions.append(editBtn, deleteBtn);
    info.append(title, price, stock, status, category, actions);
    card.appendChild(info);

    return card;
  }

  // Load products from Supabase
  async function loadProducts() {
    if (loadingProducts) return;
    loadingProducts = true;

    productList.replaceChildren();

    const count = document.getElementById("productCount");
    count.textContent = "Products load ho rahe hain...";

    const { data, error } = await db
      .from("products")
      .select("id, name, description, price, image_url, category, stock, is_active, created_at")
      .order("created_at", { ascending: false });

    loadingProducts = false;

    if (error) {
      count.textContent = "Products load nahi hue.";
      const errorText = document.createElement("p");
      errorText.className = "muted";
      errorText.textContent =
        "Error: " + error.message + " — Supabase RLS policies check karo.";
      productList.appendChild(errorText);
      return;
    }

    count.textContent = "Total products: " + data.length;

    if (data.length === 0) {
      const empty = document.createElement("p");
      empty.className = "muted";
      empty.textContent = "Abhi koi product nahi hai. Upar se pehla product add karo.";
      productList.appendChild(empty);
      return;
    }

    data.forEach(function(product) {
      productList.appendChild(createProductCard(product));
    });
  }

  // Fill form to edit a product
  function startEdit(product) {
    editingProductId = product.id;

    document.getElementById("productName").value = product.name || "";
    document.getElementById("productPrice").value = product.price;
    document.getElementById("productCategory").value = product.category || "";
    document.getElementById("productStock").value = product.stock;
    document.getElementById("productImage").value = product.image_url || "";
    document.getElementById("productDescription").value = product.description || "";
    document.getElementById("productStatus").value = String(product.is_active);

    document.getElementById("formTitle").textContent = "✏️ Edit Product";
    document.getElementById("saveBtn").textContent = "Update Product";
    document.getElementById("cancelEditBtn").style.display = "inline-block";

    clearMessage(productMessage);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Delete product
  async function deleteProduct(id, name) {
    if (!currentUser) return;

    const confirmed = confirm(
      'Kya tum "' + name + '" ko permanently delete karna chahte ho?'
    );

    if (!confirmed) return;

    const { data, error } = await db
      .from("products")
      .delete()
      .eq("id", id)
      .select("id");

    if (error) {
      alert("Delete nahi hua: " + error.message);
      return;
    }

    if (!data || data.length === 0) {
      alert("Product delete nahi hua. Admin permission/RLS check karo.");
      return;
    }

    if (editingProductId === id) {
      resetForm();
    }

    alert("Product delete ho gaya.");
    await loadProducts();
  }

  document.getElementById("refreshBtn").addEventListener(
    "click",
    loadProducts
  );

  // Respond to login/logout in other tabs or session changes.
  db.auth.onAuthStateChange(function(event, session) {
    if (event === "SIGNED_OUT") {
      showLogin();
    }
  });

  checkSession();
</script>

</body>
</html>
